<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AW 360 뷰어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 상단 제목줄 / 가운데 3D 스테이지(남는 높이 전부) / 하단 시점·크기 컨트롤 */
:root {
  --bg: #e8edf1;
  --stage-in: #868e94;
  --stage-out: #50575d;
  --fg: #14202a;
  --muted: #566673;
  --line: #c3cfd8;
  --panel: #f9fbfc;
  --accent: #087a94;
  --accent-fg: #ffffff;
  --font-body: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1318;
    --stage-in: #6a7279;
    --stage-out: #373d42;
    --fg: #e4edf2;
    --muted: #93a5b1;
    --line: #2a3843;
    --panel: #141c22;
    --accent: #5cc8e0;
    --accent-fg: #06222a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1318;
  --stage-in: #6a7279;
  --stage-out: #373d42;
  --fg: #e4edf2;
  --muted: #93a5b1;
  --line: #2a3843;
  --panel: #141c22;
  --accent: #5cc8e0;
  --accent-fg: #06222a;
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; }
body {
  height: 100%;
  box-sizing: border-box;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  color: var(--fg);
  font: 400 14px/1.5 var(--font-body);
}
.app {
  height: 100%;
  min-height: 600px;
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
.top h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.top .sub { margin: 0; font-size: 12px; color: var(--muted); }
.readout { font: 500 12px var(--font-data); color: var(--muted); font-variant-numeric: tabular-nums; }
.readout b { color: var(--accent); font-weight: 500; }

.stage {
  position: relative;
  flex: 1;
  min-height: 320px;
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  background: radial-gradient(120% 90% at 50% 38%, var(--stage-in), var(--stage-out));
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
#gl:active { cursor: grabbing; }
#gl:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
.hint { position: absolute; left: 14px; right: 14px; bottom: 12px; font-size: 12px; color: rgba(255,255,255,.86); text-shadow: 0 1px 2px rgba(0,0,0,.45); pointer-events: none; transition: opacity .5s; }
.hint.gone { opacity: 0; }
.fail { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; padding: 24px; text-align: center; color: #fff; }

.bar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.glabel { width: 100%; margin: 0 0 -4px; font-size: 12px; color: var(--muted); }
.group { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.btn {
  font: inherit; font-weight: 500;
  padding: 8px 14px; min-height: 38px;
  border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel); color: var(--fg); cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

.dims { border: 0; margin: 0; padding: 0; min-width: 0; }
.dims legend { padding: 0; margin-bottom: 4px; font-size: 12px; color: var(--muted); }
.dims .row { display: flex; flex-wrap: wrap; gap: 8px; }
.dim { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
.dim input {
  width: 84px; padding: 7px 8px;
  font: 500 14px var(--font-data); font-variant-numeric: tabular-nums;
  border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel); color: var(--fg);
}
.dim input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

@media (max-width: 560px) {
  .app { min-height: 640px; }
  .btn { padding: 8px 12px; }
}
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>

<main class="app">
  <header class="top">
    <div>
      <h1>AW 360° 뷰어</h1>
      <p class="sub">창문형 공기청정기 · 사진 기준 모델 · 쌓기 / 필터 분해</p>
    </div>
    <p class="readout">방위 <b id="az">38°</b></p>
  </header>

  <section class="stage" id="stage">
    <canvas id="gl" tabindex="0" aria-label="AW 3D 모델. 드래그하면 회전하고, 휠이나 두 손가락으로 확대합니다."></canvas>
    <div class="hint" id="hint">드래그 회전 · 휠/핀치 확대 · 부품을 클릭하면 빠져요</div>
  </section>

  <section class="bar">
    <div class="group" role="group" aria-label="시점 바꾸기">
      <button class="btn" type="button" data-th="0" data-ph="86">정면</button>
      <button class="btn" type="button" data-th="38" data-ph="80">45°</button>
      <button class="btn" type="button" data-th="90" data-ph="86">측면</button>
      <button class="btn" type="button" data-th="180" data-ph="86">후면</button>
      <button class="btn" type="button" data-th="30" data-ph="32">위</button>
      <button class="btn" type="button" id="auto" aria-pressed="true">자동 회전</button>
    </div>
    <div class="group" role="group" aria-label="쌓기와 분해">
      <button class="btn" type="button" id="stack" aria-pressed="false">위로 쌓기 (옆에서 밀어 넣기)</button>
      <button class="btn" type="button" id="open" aria-pressed="false">앞 커버·필터 빼기</button>
      <button class="btn" type="button" id="tray" aria-pressed="false">뒷판 트레이 빼기</button>
      <button class="btn" type="button" id="reset">처음 상태</button>
    </div>
    <fieldset class="dims">
      <legend>크기(mm) · 추정값, 실측을 넣으면 바로 바뀜</legend>
      <div class="row">
        <label class="dim" for="dimW">가로<input id="dimW" type="number" inputmode="numeric" min="150" max="1500" step="1" value="420"></label>
        <label class="dim" for="dimH">세로<input id="dimH" type="number" inputmode="numeric" min="150" max="1500" step="1" value="470"></label>
        <label class="dim" for="dimD">깊이<input id="dimD" type="number" inputmode="numeric" min="60" max="1000" step="1" value="210"></label>
      </div>
    </fieldset>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var canvas = $("gl"), stage = $("stage"), hint = $("hint"), azEl = $("az");

  function fail(msg) {
    stage.insertAdjacentHTML("beforeend", '<p class="fail">' + msg + "</p>");
  }
  if (!window.THREE) { fail("3D 라이브러리를 불러오지 못했습니다. 네트워크를 확인하고 새로고침해 주세요."); return; }

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  } catch (e) {
    fail("이 브라우저에서는 3D(WebGL)를 켤 수 없습니다."); return;
  }
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.78;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(30, 1, 0.05, 30);
  var maxAniso = renderer.capabilities.getMaxAnisotropy();

  /* ---------- 환경광(쿨톤 스튜디오) ---------- */
  (function makeEnv() {
    var pm = new THREE.PMREMGenerator(renderer);
    var s = new THREE.Scene();
    var room = new THREE.Mesh(
      new THREE.BoxGeometry(10, 6, 10),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(0.30, 0.36, 0.42), side: THREE.BackSide })
    );
    room.position.y = 2;
    s.add(room);
    function box(x, y, z, w, h, rx, ry, c) {
      var m = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ color: new THREE.Color(c, c, c * 1.05), side: THREE.DoubleSide })
      );
      m.position.set(x, y, z);
      m.rotation.set(rx, ry, 0);
      s.add(m);
    }
    box(0, 4.9, 0, 5, 5, Math.PI / 2, 0, 3.0);
    box(4.6, 2.2, 3, 2.4, 3.6, 0, -0.9, 2.2);
    box(-4.6, 2, -2, 2.4, 3.2, 0, 1.2, 1.4);
    box(0, 2, -4.8, 4, 2.4, 0, 0, 1.2);
    scene.environment = pm.fromScene(s, 0.03).texture;
    pm.dispose();
  })();

  scene.add(new THREE.HemisphereLight(0xe2edf7, 0xaab8c2, 0.16));
  var sun = new THREE.DirectionalLight(0xf1f7ff, 1.9);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.004;
  scene.add(sun);
  scene.add(sun.target);
  var fill = new THREE.DirectionalLight(0xdbe8f4, 0.9);
  fill.position.set(-1.2, 1.1, -1.6);
  scene.add(fill);

  /* ---------- 재질 ---------- */
  var matWhite = new THREE.MeshStandardMaterial({ color: 0xe9edf1, roughness: 0.62, metalness: 0 });
  var matWhite2 = new THREE.MeshStandardMaterial({ color: 0xe5eaee, roughness: 0.66, metalness: 0 });
  var matBezel = new THREE.MeshStandardMaterial({ color: 0xdfe5ea, roughness: 0.6, metalness: 0 });
  var matGroove = new THREE.MeshStandardMaterial({ color: 0xcfd6dc, roughness: 0.85, metalness: 0 });
  var matBar = new THREE.MeshStandardMaterial({ color: 0xeff2f5, roughness: 0.5, metalness: 0 });
  var matBtn = new THREE.MeshStandardMaterial({ color: 0xe3e8ed, roughness: 0.38, metalness: 0 });
  var matBtnIn = new THREE.MeshStandardMaterial({ color: 0xf1f4f7, roughness: 0.3, metalness: 0 });
  var matDark = new THREE.MeshStandardMaterial({ color: 0x182026, roughness: 0.95, metalness: 0 });
  var matPlate = new THREE.MeshStandardMaterial({ color: 0xe6ebef, roughness: 0.6, metalness: 0 });
  var matPanel = new THREE.MeshStandardMaterial({ color: 0xeef1f4, roughness: 0.62, metalness: 0 });
  var matHole = new THREE.MeshStandardMaterial({ color: 0x181f24, roughness: 0.95, metalness: 0 });
  var matSlit = new THREE.MeshStandardMaterial({ color: 0x8c97a0, roughness: 0.9, metalness: 0 });
  var matSlat = new THREE.MeshStandardMaterial({ color: 0xeaeef2, roughness: 0.55, metalness: 0 });

  /* ---------- 지오메트리 헬퍼 ---------- */
  function rbox(w, h, d, r, b) {
    b = b || 0.003;
    var sw = Math.max(w - 2 * b, 0.001), sh = Math.max(h - 2 * b, 0.001), sd = Math.max(d - 2 * b, 0.0005);
    var rr = Math.max(Math.min(r - b, Math.min(sw, sh) / 2 - 0.0002), 0.0003);
    var x = -sw / 2, y = -sh / 2;
    var s = new THREE.Shape();
    s.moveTo(x + rr, y);
    s.lineTo(x + sw - rr, y);
    s.quadraticCurveTo(x + sw, y, x + sw, y + rr);
    s.lineTo(x + sw, y + sh - rr);
    s.quadraticCurveTo(x + sw, y + sh, x + sw - rr, y + sh);
    s.lineTo(x + rr, y + sh);
    s.quadraticCurveTo(x, y + sh, x, y + sh - rr);
    s.lineTo(x, y + rr);
    s.quadraticCurveTo(x, y, x + rr, y);
    var g = new THREE.ExtrudeGeometry(s, {
      depth: sd, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 2, curveSegments: 5
    });
    g.translate(0, 0, -sd / 2);
    return g;
  }

  function blobTexture() {
    var c = document.createElement("canvas"); c.width = 256; c.height = 256;
    var x = c.getContext("2d");
    var g = x.createRadialGradient(128, 128, 8, 128, 128, 128);
    g.addColorStop(0, "rgba(8,18,28,0.55)");
    g.addColorStop(0.55, "rgba(8,18,28,0.18)");
    g.addColorStop(1, "rgba(8,18,28,0)");
    x.fillStyle = g; x.fillRect(0, 0, 256, 256);
    return new THREE.CanvasTexture(c);
  }

  /* ---------- 모델 ---------- */
  var group = null, units = [], pickables = [];
  var stack = { cur: 0, tgt: 0 };
  var dimsNow = { W: 0.42, H: 0.47, D: 0.21 };
  var cam = { th: 0.66, ph: 1.4, r: 1.2, tth: 0.66, tph: 1.4, tr: 1.2, minR: 0.5, maxR: 4, fit: 1.2, target: new THREE.Vector3(0, 0.23, 0) };
  var zoomTouched = false;
  var PART_NAME = { cover: "앞 커버(타공 패널)", hepa: "HEPA 필터", tray: "뒷판 필터 트레이" };

  var matFoam = new THREE.MeshStandardMaterial({ color: 0x4f5458, roughness: 1, metalness: 0 });
  var matMetal = new THREE.MeshStandardMaterial({ color: 0xc3c9cf, roughness: 0.32, metalness: 0.9 });
  var matRib = new THREE.MeshStandardMaterial({ color: 0xf1f4f6, roughness: 0.6, metalness: 0 });

  function canvasTex(w, h, draw, rep) {
    var c = document.createElement("canvas"); c.width = w; c.height = h;
    draw(c.getContext("2d"), w, h);
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = maxAniso; t.encoding = THREE.sRGBEncoding;
    return t;
  }
  var pleatTex = canvasTex(8, 32, function (x, w, h) {
    var g = x.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#f7f9fa"); g.addColorStop(0.44, "#eef1f3"); g.addColorStop(0.5, "#b4bcc2"); g.addColorStop(1, "#e2e7ea");
    x.fillStyle = g; x.fillRect(0, 0, w, h);
  });
  var meshTex = canvasTex(16, 16, function (x, w, h) {
    x.fillStyle = "rgba(232,237,240,0.40)"; x.fillRect(0, 0, w, h);
    x.fillStyle = "rgba(140,149,156,0.85)"; x.fillRect(0, 0, w, 1); x.fillRect(0, 0, 1, h);
  });
  var matPleat = new THREE.MeshStandardMaterial({ color: 0xffffff, map: pleatTex, roughness: 0.95, metalness: 0 });
  var matMesh = new THREE.MeshStandardMaterial({ color: 0xffffff, map: meshTex, transparent: true, side: THREE.DoubleSide, roughness: 1, metalness: 0, depthWrite: false });

  function disposeGroup(g) {
    g.traverse(function (o) { if (o.geometry) o.geometry.dispose(); });
    scene.remove(g);
  }

  function fitRadius(diag) {
    var asp = camera.aspect || 1;
    var k = asp < 1 ? Math.pow(1 / asp, 0.85) : 1;
    return diag * 1.75 * Math.min(k, 2.4);
  }

  /* 구멍 뚫린 둥근 사각 틀 (바깥 w×h, 안쪽 iw×ih, 안쪽 중심이 (ox,oy)만큼 이동) */
  function rframe(w, h, d, r, b, iw, ih, ox, oy) {
    var sw = w - 2 * b, sh = h - 2 * b, sd = Math.max(d - 2 * b, 0.0005);
    var rr = Math.max(Math.min(r - b, Math.min(sw, sh) / 2 - 0.0002), 0.0003);
    var x = -sw / 2, y = -sh / 2, s = new THREE.Shape();
    s.moveTo(x + rr, y); s.lineTo(x + sw - rr, y); s.quadraticCurveTo(x + sw, y, x + sw, y + rr);
    s.lineTo(x + sw, y + sh - rr); s.quadraticCurveTo(x + sw, y + sh, x + sw - rr, y + sh);
    s.lineTo(x + rr, y + sh); s.quadraticCurveTo(x, y + sh, x, y + sh - rr);
    s.lineTo(x, y + rr); s.quadraticCurveTo(x, y, x + rr, y);
    var hw = iw / 2 + b, hh = ih / 2 + b, hp = new THREE.Path();
    hp.moveTo(ox - hw, oy - hh); hp.lineTo(ox + hw, oy - hh); hp.lineTo(ox + hw, oy + hh); hp.lineTo(ox - hw, oy + hh); hp.lineTo(ox - hw, oy - hh);
    s.holes.push(hp);
    var g = new THREE.ExtrudeGeometry(s, { depth: sd, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 2, curveSegments: 5 });
    g.translate(0, 0, -sd / 2);
    return g;
  }
  function ringGeo(ro, ri, depth) {
    var s = new THREE.Shape(); s.absarc(0, 0, ro, 0, Math.PI * 2, false);
    var p = new THREE.Path(); p.absarc(0, 0, ri, 0, Math.PI * 2, true); s.holes.push(p);
    return new THREE.ExtrudeGeometry(s, { depth: depth, bevelEnabled: false, curveSegments: 40 });
  }

  function build(wmm, hmm, dmm) {
    if (group) disposeGroup(group);
    var W = wmm / 1000, H = hmm / 1000, D = dmm / 1000;
    dimsNow = { W: W, H: H, D: D };
    var k = D / 243;                         /* 측면 사진 기준 깊이 243단위 -> m */
    function zu(u) { return D / 2 - u * k; }   /* 앞면 u=0, 뒤 u=243 */
    var STACK_DY = 0.715 * H;                  /* 윗단: 아랫단 앞 커버 위쪽 끝(0.99H)에 윗단 커버 아래 끝(0.275H)이 닿는 높이 */
    var TRAY_L = 0.77 * W;

    function put(parent, geo, mat, x, y, z, shadow) {
      var m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      m.castShadow = shadow !== false;
      m.receiveShadow = true;
      parent.add(m);
      return m;
    }
    /* x0~x1, y0~y1, 깊이 u0~u1 짜리 둥근 막대/판 */
    function bar(parent, x0, x1, y0, y1, u0, u1, mat, r, b) {
      if (x1 - x0 < 0.002 || y1 - y0 < 0.002) return null;
      return put(parent, rbox(x1 - x0, y1 - y0, (u1 - u0) * k, r || 0.004, b || 0.0022), mat, (x0 + x1) / 2, (y0 + y1) / 2, zu((u0 + u1) / 2));
    }

    /* ---- 전면 타공 패널 치수(커버·베이스 공용) ---- */
    var pw = 0.766 * W, ph = 0.67 * H, py = 0.625 * H, th = 19 * k;
    var border = 0.012 * W, cols = 36, lw = pw - 2 * border, p = lw / (cols + 0.5), hs = 0.5 * p, t = p - hs;
    var rows = Math.max(8, Math.round((ph - 2 * border - t) / p)), lh = rows * p + t;
    var phA = lh + 2 * border;

    function makeUnit(isUpper) {
      var root = new THREE.Group();
      var cover = new THREE.Group(), hepa = new THREE.Group(), tray = new THREE.Group();
      root.add(cover); root.add(hepa); root.add(tray);
      var zmin = isUpper ? 0.23 : 0.0;           /* 윗단은 아래쪽 컨트롤 바 영역이 없음 */
      function slab(u0, u1, w, vb, vt, mat, r, b) {
        return bar(root, -w * W / 2, w * W / 2, Math.max(vb, zmin) * H, vt * H, u0, u1, mat, r, b);
      }

      /* ===== 본체(고정) ===== */
      /* 판 A: 앞쪽에 필터가 들어가는 오목한 자리(포켓)가 있음 */
      var vA = Math.max(0, zmin) * H, pk = 0.39 * W;
      bar(root, -0.5 * W, -pk, vA, 0.945 * H, 70, 120, matPlate, 0.004, 0.0012);
      bar(root, pk, 0.5 * W, vA, 0.945 * H, 70, 120, matPlate, 0.004, 0.0012);
      bar(root, -pk, pk, vA, 0.30 * H, 70, 84, matPlate, 0.003, 0.0010);
      bar(root, -pk, pk, 0.925 * H, 0.945 * H, 70, 84, matPlate, 0.003, 0.0010);
      bar(root, -pk, pk, vA, 0.945 * H, 84, 120, matPlate, 0.003, 0.0010);
      slab(150, 190, 1.0, 0.0, 0.95, matPlate);                                  /* 판 B */
      var cy0 = Math.max(0.12, zmin) * H;
      put(root, new THREE.BoxGeometry(0.86 * W, 0.93 * H - cy0, 31 * k), matGroove, 0, (cy0 + 0.93 * H) / 2, zu(135));   /* 속통 */

    canvas.style.cursor = h ? "pointer" : "";

  });
  canvas.addEventListener("pointerleave", function () { canvas.style.cursor = ""; });

  /* ---------- 카메라 조작(드래그·휠·핀치·키보드) ---------- */
  var PHI_MIN = 0.2, PHI_MAX = 1.78;
  var clamp = function (v, a, b) { return Math.min(b, Math.max(a, v)); };
  var wrap = function (a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };

    vth = 0; lastMoveT = performance.now();
    stopAuto(); hideHint();
    if (ptrs.size === 2) {
      var a = Array.from(ptrs.values());

    }
  });
  canvas.addEventListener("pointermove", function (e) {

    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 1) {
      var now = performance.now(), dt = Math.max(now - lastMoveT, 8) / 1000;

    } else if (ptrs.size === 2 && pinch0 > 0) {

    }
    if (down && down.id === e.pointerId) down = null;
    ptrs.delete(e.pointerId);
    if (ptrs.size === 0) {

  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);
  canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    var dy = e.deltaY * (e.deltaMode === 1 ? 16 : 1);

  }, { passive: false });
  canvas.addEventListener("keydown", function (e) {
    var used = true;
    if (e.key === "ArrowLeft") cam.tth -= 0.15;
    else if (e.key === "ArrowRight") cam.tth += 0.15;
    else if (e.key === "ArrowUp") cam.tph = clamp(cam.tph - 0.1, PHI_MIN, PHI_MAX);
    else if (e.key === "ArrowDown") cam.tph = clamp(cam.tph + 0.1, PHI_MIN, PHI_MAX);
    else if (e.key === "+" || e.key === "=") { cam.tr = clamp(cam.tr * 0.9, cam.minR, cam.maxR); zoomTouched = true; }
    else if (e.key === "-") { cam.tr = clamp(cam.tr * 1.1, cam.minR, cam.maxR); zoomTouched = true; }
    else used = false;
    if (used) { e.preventDefault(); stopAuto(); hideHint(); }
  });

  function setView(thDeg, phDeg) {
    cam.tth = cam.tth + wrap(thDeg * Math.PI / 180 - cam.tth);
    cam.tph = clamp(phDeg * Math.PI / 180, PHI_MIN, PHI_MAX);
    cam.tr = cam.fit; zoomTouched = false;

  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-th]"), function (b) {
    b.addEventListener("click", function () { setView(+b.getAttribute("data-th"), +b.getAttribute("data-ph")); });
  });
  autoBtn.addEventListener("click", function () {
    autoOn = !autoOn;
    autoBtn.setAttribute("aria-pressed", String(autoOn));
  });

  /* ---------- 크기 입력 ---------- */
  var dW = $("dimW"), dH = $("dimH"), dD = $("dimD");
  function applyDims() {
    var w = clamp(Math.round(+dW.value) || 420, 150, 1500);
    var h = clamp(Math.round(+dH.value) || 470, 150, 1500);
    var d = clamp(Math.round(+dD.value) || 210, 60, 1000);
    dW.value = w; dH.value = h; dD.value = d;
    build(w, h, d);
  }
  [dW, dH, dD].forEach(function (el) { el.addEventListener("change", applyDims); });

  /* ---------- 크기 맞춤 · 렌더 루프 ---------- */
  function resize() {
    var r = stage.getBoundingClientRect();
    var w = Math.max(1, Math.floor(r.width)), h = Math.max(1, Math.floor(r.height));
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    if (!zoomTouched && group) {
      var W = +dW.value / 1000, H = +dH.value / 1000, D = +dD.value / 1000;
      cam.fit = fitRadius(Math.sqrt(W * W + H * H + D * D));
      cam.tr = cam.fit;
    }
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  else window.addEventListener("resize", resize);

  resize();
  applyDims();
  cam.r = cam.tr;

  var last = performance.now(), lastAz = -1;
  function frame(t) {
    requestAnimationFrame(frame);
    var dt = Math.min((t - last) / 1000, 0.05);
    last = t;
    if (ptrs.size === 0) {
      if (autoOn) cam.tth += 0.45 * dt;
      cam.tth += vth * dt;
      vth *= Math.exp(-dt * 3.5);
    }
    animate(dt);
    var k = 1 - Math.exp(-dt * 10);
    cam.th += (cam.tth - cam.th) * k;
    cam.ph += (cam.tph - cam.ph) * k;
    cam.r += (cam.tr - cam.r) * k;
    var sp = Math.sin(cam.ph);
    camera.position.set(
      cam.target.x + cam.r * sp * Math.sin(cam.th),
      cam.target.y + cam.r * Math.cos(cam.ph),
      cam.target.z + cam.r * sp * Math.cos(cam.th)

    renderer.render(scene, camera);
    var az = Math.round((((cam.th * 180 / Math.PI) % 360) + 360) % 360) % 360;

  }
  requestAnimationFrame(frame);
  window.__aw = { stack: setStack, all: setAll, toggle: function (ui, part) { toggle(units[ui], part); },
    snap: function () { stack.cur = stack.tgt; units.forEach(function (u) { ["cover", "hepa", "tray"].forEach(function (n) { u.p[n].cur = u.p[n].tgt; }); }); animate(0.0001); },
    set: function (th, ph, rf) { autoOn = false; cam.th = cam.tth = th * Math.PI / 180; cam.ph = cam.tph = ph * Math.PI / 180; cam.r = cam.tr = cam.fit * (rf || 1); } };
})();
